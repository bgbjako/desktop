# SPDX-License-Identifier: GPL-2.0-or-later
# LEDGE V0 — Windows installer build (KDE Craft). Produces an unsigned NSIS .exe
# from the rebranded source and uploads it as a workflow artifact.
# Mirrors upstream windows-build-and-test.yml's known-good Craft setup, then adds
# the packaging + upload steps that the test workflow lacks. See BRANDING.md.
name: Ledge Windows

on:
  workflow_dispatch:
  push:
    branches: [ledge]
    paths:
      - 'NEXTCLOUD.cmake'
      - 'theme/**'
      - 'src/**'
      - 'craftmaster.ini'
      - '.github/workflows/ledge-windows.yml'

jobs:
  build:
    name: Ledge Windows Installer
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\craftmaster.ini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Craft + Nextcloud client deps
        shell: pwsh
        run: |
          & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|stable-33.0|"
          craft --add-blueprint-repository "https://github.com/nextcloud/desktop-client-blueprints.git|stable-33.0|"
          craft craft
          craft --install-deps nextcloud-client

      - name: Install inkscape (icon rasterisation)
        shell: pwsh
        run: choco install inkscape -y --no-progress

      - name: Work around upstream blueprint bug (missing 'import os')
        # desktop-client-blueprints@stable-33.0 nextcloud-client.py calls os.path.join
        # in createPackage() but never imports os -> NameError during --package.
        # Prepend the import to the cloned blueprint before packaging.
        shell: pwsh
        run: |
          $bp = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\desktop-client-blueprints\nextcloud-client\nextcloud-client.py"
          if (-not (Test-Path $bp)) { Write-Host "::error::blueprint not found at $bp"; exit 1 }
          $c = Get-Content $bp -Raw
          if ($c -notmatch '(?m)^\s*import os\s*$') {
              Set-Content -Path $bp -Value ("import os`r`n" + $c)
              Write-Host "Patched: prepended 'import os' to nextcloud-client blueprint."
          } else {
              Write-Host "Blueprint already imports os; no patch needed."
          }
          Get-Content $bp -TotalCount 3

      - name: Compile + package from rebranded source
        shell: pwsh
        run: |
          function craft() {
              python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
              if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # Build the client from our checked-out (rebranded) tree, then package it.
          craft --src-dir "${{ github.workspace }}" nextcloud-client
          craft --src-dir "${{ github.workspace }}" --package nextcloud-client

      - name: Collect installer
        shell: pwsh
        run: |
          $dest = "${{ github.workspace }}\artifacts"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Craft's NullsoftInstallerPackager writes the NSIS installer to <CraftRoot>\tmp.
          # Collect ONLY that (the bin/ dir is the clang/LLVM toolchain — not what we ship).
          $pkgDir = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp"
          $installers = Get-ChildItem -Path $pkgDir -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match "windows" }
          if (-not $installers) {
              Write-Host "::error::No installer .exe in $pkgDir. Directory contents:"
              Get-ChildItem -Path $pkgDir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host (" {0}" -f $_.Name) }
              exit 1
          }
          $installers | ForEach-Object {
              # Friendlier name: nextcloud-client-ledge-... -> Ledge-Setup-...
              $newName = $_.Name -replace '^nextcloud-client-ledge', 'Ledge-Setup'
              Write-Host ("installer: {0} ({1:N0} MB) -> {2}" -f $_.Name, ($_.Length/1MB), $newName)
              Copy-Item $_.FullName (Join-Path $dest $newName)
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ledge-Windows-Installer
          path: ${{ github.workspace }}\artifacts\*
          if-no-files-found: error
